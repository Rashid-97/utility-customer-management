name: utility-customer-management

x-application-environment: &application-environment
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-customer_management}:${POSTGRES_PASSWORD:-customer_management}@db:5432/${POSTGRES_DB:-customer_management}

x-application-volumes: &application-volumes
  - ./src:/app/src:ro
  - ./migrations:/app/migrations:ro
  - ./alembic.ini:/app/alembic.ini:ro

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-customer_management}
      POSTGRES_USER: ${POSTGRES_USER:-customer_management}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_management}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: .
    command: ["python", "-m", "alembic", "upgrade", "head"]
    environment: *application-environment
    volumes: *application-volumes
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
    command:
      - python
      - -m
      - uvicorn
      - customer_management.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/src
    environment: *application-environment
    volumes: *application-volumes
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/openapi.json', timeout=2)
      interval: 5s
      timeout: 5s
      retries: 12
    init: true
    restart: unless-stopped

volumes:
  postgres_data:

